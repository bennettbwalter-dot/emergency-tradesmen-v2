  <!-- hreflang (dynamic per domain — canonical managed by React Helmet) -->
  <script>
    (function() {
      var h = window.location.hostname;
      var path = window.location.pathname;
      var isUS = h.indexOf('emergencycontractors') !== -1 || (h === 'localhost' && window.location.port === '3001');
      var ukBase = 'https://emergencytradesmen.net';
      var usBase = 'https://emergencycontractors.net';
      var self = isUS ? usBase : ukBase;
      // hreflang - GB
      var gb = document.createElement('link');
      gb.rel = 'alternate'; gb.hreflang = 'en-GB'; gb.href = ukBase + path;
      document.head.appendChild(gb);
      // hreflang - US
      var us = document.createElement('link');
      us.rel = 'alternate'; us.hreflang = 'en-US'; us.href = usBase + path;
      document.head.appendChild(us);
      // hreflang - x-default
      var xd = document.createElement('link');
      xd.rel = 'alternate'; xd.hreflang = 'x-default'; xd.href = ukBase + path;
      document.head.appendChild(xd);
      
      // Global Organization Schema (NAP Data)
      var orgSchema = {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": isUS ? "Emergency Contractors" : "Emergency Tradesmen",
        "url": self,
        "logo": self + "/et-logo-v3.png",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer service",
          "availableLanguage": ["English"]
        }
      };
      var script = document.createElement('script');
      script.type = 'application/ld+json';
      script.text = JSON.stringify(orgSchema);
      document.head.appendChild(script);
    })();
  </script>

  <!-- Google AdSense (production only, deferred until after LCP) -->
  <script>
    (function() {
      var h = window.location.hostname;
      if (h !== 'emergencytradesmen.net' && h !== 'www.emergencytradesmen.net' &&
          h !== 'emergencycontractors.net' && h !== 'www.emergencycontractors.net') return;
      var load = function(){
        var s = document.createElement('script');
        s.async = true;
        s.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1777113776734777";
        s.crossOrigin = "anonymous";
        document.head.appendChild(s);
      };
      var schedule = function(){
        if ('requestIdleCallback' in window) requestIdleCallback(load, { timeout: 6000 });
        else setTimeout(load, 4000);
      };
      if (document.readyState === 'complete') schedule();
      else window.addEventListener('load', schedule, { once: true });
    })();
  </script>

  <!-- Self-Healing Logic: Detect white screen (stale cache) and refresh -->
  <script>
    (function () {
      if (window.location.hostname !== 'emergencycontractors.net' &&
        window.location.hostname !== 'www.emergencycontractors.net' &&
        window.location.hostname !== 'emergencytradesmen.net' &&
        window.location.hostname !== 'www.emergencytradesmen.net' &&
        window.location.hostname !== 'localhost') return;

      window.addEventListener('load', function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          var isAppLoaded = root && (root.children.length > 0 || root.innerText.length > 0);
          var hasRefreshed = sessionStorage.getItem('app_auto_refresh');

          if (!isAppLoaded && !hasRefreshed) {
            console.warn('App failed to mount. Attempting self-healing refresh...');
            sessionStorage.setItem('app_auto_refresh', 'true');
            // Hard reload to bypass cache
            window.location.reload(true);
          } else if (isAppLoaded) {
            sessionStorage.removeItem('app_auto_refresh');
          }
        }, 5000); // Wait 5 seconds for slow connections
      });
    })();
  </script>
