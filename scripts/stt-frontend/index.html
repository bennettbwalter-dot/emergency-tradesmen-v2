<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Tradesmen - Voice Assistant</title>
    <style>
        :root {
            --primary: #ef4444;
            --primary-hover: #dc2626;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        p {
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 0.875rem;
        }

        .mic-btn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: var(--primary);
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 2rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            outline: none;
        }

        .mic-btn:hover {
            background-color: var(--primary-hover);
            transform: scale(1.05);
        }

        .mic-btn:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        .mic-btn.recording {
            animation: pulse 1.5s infinite;
            background-color: #b91c1c;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }

            70% {
                box-shadow: 0 0 0 20px rgba(239, 68, 68, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        .mic-icon {
            width: 48px;
            height: 48px;
            fill: white;
        }

        .status {
            font-weight: 500;
            margin-bottom: 1.5rem;
            min-height: 1.5rem;
        }

        .results {
            background-color: #0f172a;
            padding: 1.5rem;
            border-radius: 0.75rem;
            text-align: left;
            display: none;
            border: 1px solid #334155;
        }

        .results h2 {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-top: 0;
            margin-bottom: 1rem;
        }

        .data-item {
            margin-bottom: 0.75rem;
        }

        .data-label {
            color: #94a3b8;
            font-size: 0.75rem;
            display: block;
        }

        .data-value {
            font-size: 0.9375rem;
            font-weight: 500;
        }

        .urgency-high {
            color: #f87171;
            font-weight: 700;
        }

        .visualizer {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 3px;
            height: 40px;
            margin-bottom: 2rem;
        }

        .bar {
            width: 4px;
            background-color: var(--primary);
            border-radius: 2px;
            transition: height 0.1s ease;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Emergency Dispatch</h1>
        <p>State your emergency and location clearly.</p>

        <div class="visualizer" id="visualizer">
            <!-- Driven by JS -->
            <div class="bar" style="height: 10%"></div>
            <div class="bar" style="height: 10%"></div>
            <div class="bar" style="height: 10%"></div>
            <div class="bar" style="height: 10%"></div>
            <div class="bar" style="height: 10%"></div>
            <div class="bar" style="height: 10%"></div>
            <div class="bar" style="height: 10%"></div>
            <div class="bar" style="height: 10%"></div>
            <div class="bar" style="height: 10%"></div>
            <div class="bar" style="height: 10%"></div>
        </div>

        <button id="micBtn" class="mic-btn">
            <svg class="mic-icon" viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" />
                <path
                    d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
            </svg>
        </button>

        <div id="status" class="status">Tap to speak</div>

        <div id="results" class="results">
            <h2>Incident Report</h2>
            <div class="data-item">
                <span class="data-label">Transcription</span>
                <span id="transcriptionBox" class="data-value">-</span>
            </div>
            <div class="data-item">
                <span class="data-label">Trade Needed</span>
                <span id="tradeBox" class="data-value">-</span>
            </div>
            <div class="data-item">
                <span class="data-label">Location</span>
                <span id="locationBox" class="data-value">-</span>
            </div>
            <div class="data-item">
                <span class="data-label">Urgency</span>
                <span id="urgencyBox" class="data-value">-</span>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
