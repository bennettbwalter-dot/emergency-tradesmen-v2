<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14532d"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="500" fill="url(#bg)" rx="0"/>
  
  <!-- Decorative elements -->
  <circle cx="150" cy="200" r="25" fill="#86efac" opacity="0.15"/><circle cx="250" cy="180" r="20" fill="#86efac" opacity="0.2"/><circle cx="200" cy="250" r="18" fill="#86efac" opacity="0.15"/>
  
  <!-- Corner accents -->
  <path d="M 0 0 L 60 0 L 40 20 L 0 20 Z" fill="#86efac" opacity="0.4"/>
  <path d="M 400 500 L 340 500 L 360 480 L 400 480 Z" fill="#86efac" opacity="0.4"/>
  
  <!-- Title text -->
  <g filter="url(#shadow)">
    
    <text x="200" y="245" 
          font-family="Arial, Helvetica, sans-serif" 
          font-size="28" 
          font-weight="bold" 
          fill="white" 
          text-anchor="middle" 
          letter-spacing="1">Sewer Backup Prevention</text>
    
    
    <text x="200" y="285" 
          font-family="Arial, Helvetica, sans-serif" 
          font-size="28" 
          font-weight="bold" 
          fill="white" 
          text-anchor="middle" 
          letter-spacing="1">UK</text>
    
  </g>
  
  <!-- Subtitle -->
  <text x="200" y="345" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="14" 
        fill="#86efac" 
        text-anchor="middle" 
        letter-spacing="2" 
        opacity="0.8">EMERGENCY GUIDE 2026</text>
</svg>