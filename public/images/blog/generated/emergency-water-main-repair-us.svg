<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a1d6a"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="500" fill="url(#bg)" rx="0"/>
  
  <!-- Decorative elements -->
  <path d="M 80 300 Q 140 270 200 300 T 320 300" stroke="#c4b5fd" stroke-width="3" fill="none" opacity="0.4"/><path d="M 60 320 Q 120 290 180 320 T 340 320" stroke="#c4b5fd" stroke-width="2" fill="none" opacity="0.3"/>
  
  <!-- Corner accents -->
  <path d="M 0 0 L 60 0 L 40 20 L 0 20 Z" fill="#c4b5fd" opacity="0.4"/>
  <path d="M 400 500 L 340 500 L 360 480 L 400 480 Z" fill="#c4b5fd" opacity="0.4"/>
  
  <!-- Title text -->
  <g filter="url(#shadow)">
    
    <text x="200" y="262.5" 
          font-family="Arial, Helvetica, sans-serif" 
          font-size="28" 
          font-weight="bold" 
          fill="white" 
          text-anchor="middle" 
          letter-spacing="1">Water Main Repair US</text>
    
  </g>
  
  <!-- Subtitle -->
  <text x="200" y="322.5" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="14" 
        fill="#c4b5fd" 
        text-anchor="middle" 
        letter-spacing="2" 
        opacity="0.8">EMERGENCY GUIDE 2026</text>
</svg>