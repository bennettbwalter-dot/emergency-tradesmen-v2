<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="500" fill="url(#bg)" rx="0"/>
  
  <!-- Decorative elements -->
  <rect x="160" y="170" width="80" height="60" rx="4" stroke="#60a5fa" stroke-width="3" fill="none" opacity="0.3"/><path d="M 160 200 L 280 200" stroke="#60a5fa" stroke-width="2" opacity="0.3"/>
  
  <!-- Corner accents -->
  <path d="M 0 0 L 60 0 L 40 20 L 0 20 Z" fill="#60a5fa" opacity="0.4"/>
  <path d="M 400 500 L 340 500 L 360 480 L 400 480 Z" fill="#60a5fa" opacity="0.4"/>
  
  <!-- Title text -->
  <g filter="url(#shadow)">
    
    <text x="200" y="262.5" 
          font-family="Arial, Helvetica, sans-serif" 
          font-size="28" 
          font-weight="bold" 
          fill="white" 
          text-anchor="middle" 
          letter-spacing="1">Emergency Tradesmen UK</text>
    
  </g>
  
  <!-- Subtitle -->
  <text x="200" y="322.5" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="14" 
        fill="#60a5fa" 
        text-anchor="middle" 
        letter-spacing="2" 
        opacity="0.8">EMERGENCY GUIDE 2026</text>
</svg>