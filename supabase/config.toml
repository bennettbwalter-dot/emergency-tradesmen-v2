
# Admin-only knowledge graph (Graphify). verify_jwt rejects unauthenticated
# callers at the platform edge; the function itself additionally requires an
# admin email. The pre-sanitized graph.data.json is bundled via JSON import.
[functions.knowledge-graph]
enabled = true
verify_jwt = true

[functions.fetch-jit-listings]
enabled = true
verify_jwt = true
import_map = "./functions/fetch-jit-listings/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/fetch-jit-listings/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/fetch-jit-listings/*.html" ]
